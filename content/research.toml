link = "/research/conservation-genomics"

[[items]]
title = "Genomics and Climate Adaptation of Hardwood Trees"
category = "Forest Genetics, Genomics & Tree Breeding"
content = "Uses morpho-physiology, population genomics, comparative genomics, and field data to understand adaptation of hardwood species to abiotic stress and climate variation."
tags = ["Forest Genetics/Genomics", "Tree Breeding", "Climate Adaptation"]
link = "/research/forest-genetics-genomics"

[[items]]
