description = "Our research integrates **forest genetics and genomics, tree breeding, conservation genomics, phenomics, remote sensing, and bioinformatics** to improve the conservation, restoration, productivity, and resilience of forest trees."

[[items]]
title = "Conservation Genomics of Butternut (Juglans cinerea)"
category = "Conservation Genomics & Forest Restoration"
content = "Integrates population and landscape genetics, hybrid identification, disease-resistance assessment, field trials, and advanced phenotyping to support conservation and restoration of threatened butternut."
tags = ["Conservation Genomics", "Forest Restoration", "Butternut"]
