summary = "This program combines morpho-physiology, population genomics, comparative genomics, and field data to understand how hardwood species adapt to abiotic stress and climate variation. The long-term goal is to translate genetic and physiological knowledge into practical tools for tree improvement, seed sourcing, and climate-resilient forestry."
