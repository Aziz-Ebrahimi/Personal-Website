[workflow]
title = "From observation to forest insight"
introduction = "Explore two analytical paths: derive features from sensing data, or learn directly from imagery. Genetic analyses also require independently collected genomic markers."
feature_path_label = "Feature-based analysis"
image_path_label = "Direct imagery analysis"
genomic_input_label = "Independent genomic markers"
genomic_input_description = "Collected separately from sensing data · required for GWAS and genomic selection"

[[workflow.steps]]
id = "sensing"
label = "Remote sensing"
description = "RGB captures canopy appearance; multispectral and hyperspectral imagery describe spectral variation; LiDAR describes three-dimensional structure. These observations complement field measurements."
application = "Observe forest canopies across space and time."

[[workflow.steps]]
id = "features"
label = "Phenotypes"
description = "RGB provides vegetation indices such as VARI and ExG; multispectral data supports NDVI, RTVI, and NDRE. Hyperspectral phenotyping can include 200+ bands and 200+ vegetation indices, depending on the sensor and processing workflow. LiDAR describes tree height, canopy density, and crown dimensions. These are illustrative capabilities, not confirmed dataset specifications."
application = "Build interpretable descriptions of tree condition and growth."

[[workflow.steps]]
id = "ml"
label = "Machine learning"
description = "Models connect extracted features with observed outcomes. Held-out data evaluates prediction errors and generalization across trees, sites, and conditions."
application = "Predict forest traits and investigate relationships among observations."

[[workflow.steps]]
id = "dl"
label = "Deep learning"
description = "Individual-tree image patches include a crown and surrounding buffer. Layered models learn representations directly from these patches, bypassing manual feature extraction. Training labels and independent evaluation remain necessary to assess trait predictions."
application = "Learn useful patterns from canopy images and sensing data."

[[workflow.steps]]
id = "gwas"
label = "GWAS"
description = "Genome-wide association studies combine measured or estimated phenotypes with independently collected genomic markers to investigate trait associations. Population structure and relatedness must be considered."
application = "Investigate genetic variation associated with forest traits."

[[workflow.steps]]
id = "selection"
label = "Genomic selection"
description = "Training phenotypes and genome-wide markers inform a model that is evaluated before application. Candidate genotypes then support prediction of breeding values alongside field evidence."
application = "Support evaluation and selection of breeding material."

[[workflow.steps]]
id = "applications"
label = "Forest applications"
description = "Condition assessment, growth and productivity prediction, and breeding selection connect these methods to forest research. Predictive evaluation and scenario modeling help interpret outcomes under different conditions."
application = "Inform forest monitoring, research, and breeding decisions. Verified operational results: To be added."
