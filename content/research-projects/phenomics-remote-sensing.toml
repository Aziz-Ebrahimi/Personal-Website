title = "Forest Health and Production"
visualization = "forest-health"
subtitle = "From forest observations to prediction and genetic improvement"
category = "Forest Health, Productivity & Genetic Improvement"
summary = "This research connects remote sensing, artificial intelligence, and genomics to understand forest health, growth, and productivity. Extracted features support machine learning and phenotyping, while deep learning can learn directly from imagery. Independently collected genomic markers connect measured or estimated phenotypes with genetic association studies and genomic selection."
related_publications_categories = ["Phenomics/Remote Sensing", "Forest Genetics/Genomics", "Bioinformatics/Machine Learning"]

[[sections]]
title = "Research Questions"
content = "How can sensing and field observations describe forest health, growth, and productivity? Which features and learned image representations support useful predictions across sites and environmental conditions? How can genetic associations and genomic prediction support evaluation of breeding material?"

[[sections]]
title = "Approach"
content = "RGB, multispectral, hyperspectral, and LiDAR observations complement field measurements. Derived features support machine learning; deep learning can learn representations directly from imagery. Measured or estimated phenotypes and independently collected genomic markers support GWAS and genomic selection. Held-out evaluation, interpretation, and scenario modeling connect predictions with biological evidence. Sensor specifications, study sites, datasets, model architectures, and evaluation protocols: **To be added**."

[[sections]]
title = "Impact"
content = "The goal is to improve the speed and scale of forest-health assessment and connect phenomic measurements with genomic and breeding decisions. Verified performance results and operational applications: **To be added**."

